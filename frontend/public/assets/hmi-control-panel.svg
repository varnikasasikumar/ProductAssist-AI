<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" fill="#0f172a" rx="12"/>
  <text x="300" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CNC-X100 Front Right HMI Control Console</text>
  
  <!-- Outer Frame -->
  <rect x="40" y="50" width="520" height="270" fill="#1e293b" stroke="#475569" stroke-width="3" rx="10"/>
  
  <!-- HMI Display Screen -->
  <rect x="60" y="70" width="340" height="230" fill="#0284c7" fill-opacity="0.1" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <rect x="70" y="80" width="320" height="40" fill="#ef4444" rx="4"/>
  <text x="80" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">ALARM ACTIVE: E105 - COOLANT FLOW LOW</text>

  <rect x="70" y="130" width="320" height="110" fill="#0f172a" rx="4"/>
  <text x="85" y="155" fill="#38bdf8" font-family="monospace" font-size="12">P-101 Pump Status: RUNNING</text>
  <text x="85" y="175" fill="#f43f5e" font-family="monospace" font-size="12">FM-1 Flow Rate   : 8.2 L/min (MIN 12.0)</text>
  <text x="85" y="195" fill="#f59e0b" font-family="monospace" font-size="12">Spindle Temp     : 42.5 C (NORMAL)</text>
  <text x="85" y="215" fill="#94a3b8" font-family="monospace" font-size="12">Axis Position    : X:+120.4 Y:-45.2 Z:0.0</text>

  <rect x="70" y="250" width="100" height="35" fill="#10b981" rx="4"/>
  <text x="120" y="272" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RESET FAULT</text>

  <rect x="180" y="250" width="100" height="35" fill="#0284c7" rx="4"/>
  <text x="230" y="272" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DIAGNOSTICS</text>

  <!-- Side Physical Controls -->
  <!-- E-Stop Button -->
  <circle cx="480" cy="110" r="30" fill="#dc2626" stroke="#991b1b" stroke-width="4"/>
  <circle cx="480" cy="110" r="22" fill="#ef4444"/>
  <text x="480" y="114" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">E-STOP</text>

  <!-- Key Switch -->
  <circle cx="480" cy="190" r="20" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <line x1="480" y1="175" x2="480" y2="205" stroke="#f8fafc" stroke-width="3"/>
  <text x="480" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mode Key</text>

  <!-- Start Button -->
  <circle cx="480" cy="270" r="18" fill="#16a34a" stroke="#15803d" stroke-width="3"/>
  <text x="480" y="274" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">START</text>
</svg>
