<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="coolantGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="#0f172a" rx="12"/>
  <text x="300" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CNC-X100 Coolant Subsystem &amp; Intake Screen Assembly</text>
  <text x="300" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Location: Lower Rear Service Enclosure (Access Door B)</text>

  <!-- Coolant Tank -->
  <rect x="50" y="160" width="220" height="180" fill="url(#metalGrad)" stroke="#475569" stroke-width="2" rx="8"/>
  <rect x="60" y="210" width="200" height="120" fill="url(#coolantGrad)" rx="4"/>
  <text x="160" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Coolant Reservoir Tank (50L)</text>
  
  <!-- Sight Glass -->
  <rect x="240" y="220" width="16" height="80" fill="#0284c7" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <line x1="235" y1="240" x2="260" y2="240" stroke="#f43f5e" stroke-width="2"/>
  <text x="225" y="244" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="end">Min Level</text>
  
  <!-- Intake Screen / Mesh Filter -->
  <rect x="90" y="280" width="60" height="40" fill="#e2e8f0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,2" rx="4"/>
  <text x="120" y="304" fill="#0f172a" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Mesh Screen</text>

  <!-- Pump Unit -->
  <rect x="330" y="140" width="120" height="100" fill="#334155" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <circle cx="390" cy="190" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M390,165 L390,215 M365,190 L415,190" stroke="#38bdf8" stroke-width="3"/>
  <text x="390" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Coolant Pump (P-101)</text>

  <!-- Flow Sensor FM-1 -->
  <rect x="490" y="170" width="70" height="40" fill="#0f766e" stroke="#14b8a6" stroke-width="2" rx="6"/>
  <text x="525" y="194" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FM-1 Sensor</text>

  <!-- Pipes -->
  <path d="M120,280 L120,190 L330,190" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M450,190 L490,190" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <path d="M560,190 L580,190 L580,80 L300,80" fill="none" stroke="#0284c7" stroke-width="6"/>

  <!-- Annotations / Callouts -->
  <!-- Callout 1: Mesh Screen (E105 Cause) -->
  <line x1="120" y1="320" x2="120" y2="365" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2,2"/>
  <rect x="40" y="350" width="160" height="30" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" rx="4"/>
  <text x="120" y="370" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Key E105 Location: Intake Mesh</text>

  <!-- Callout 2: Flow Sensor FM-1 -->
  <line x1="525" y1="210" x2="525" y2="280" stroke="#14b8a6" stroke-width="2" stroke-dasharray="2,2"/>
  <rect x="450" y="280" width="130" height="30" fill="#134e4a" stroke="#14b8a6" stroke-width="1.5" rx="4"/>
  <text x="515" y="300" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FM-1 Signal Output</text>
</svg>
