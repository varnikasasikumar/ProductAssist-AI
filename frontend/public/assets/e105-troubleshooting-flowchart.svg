<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%" height="100%">
  <rect width="700" height="350" fill="#0f172a" rx="12"/>
  <text x="350" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Agentic Troubleshooting State Machine — Alarm E105</text>
  
  <!-- Step 1 -->
  <rect x="30" y="70" width="130" height="80" fill="#1e293b" stroke="#f43f5e" stroke-width="2" rx="8"/>
  <text x="95" y="95" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. Alarm E105</text>
  <text x="95" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Coolant Flow Low</text>
  <text x="95" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">&lt; 12.0 L/min</text>

  <path d="M160,110 L190,110" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="190" y="70" width="140" height="80" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="260" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. Check Sight Glass</text>
  <text x="260" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Reservoir Level</text>
  <text x="260" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Above Min Line?</text>

  <path d="M330,110 L360,110" stroke="#475569" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="360" y="70" width="140" height="80" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="430" y="95" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. Inspect Filter</text>
  <text x="430" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Intake Screen Mesh</text>
  <text x="430" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Clean Metal Debris</text>

  <path d="M500,110 L530,110" stroke="#475569" stroke-width="2"/>

  <!-- Step 4 -->
  <rect x="530" y="70" width="140" height="80" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="600" y="95" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4. Clear &amp; Verify</text>
  <text x="600" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Press Reset on HMI</text>
  <text x="600" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Flow &gt; 18.5 L/min</text>

  <!-- Decision / Sub-branches -->
  <rect x="190" y="200" width="480" height="110" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4" rx="8"/>
  <text x="210" y="225" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Secondary Verification Steps &amp; Diagnostics:</text>
  <text x="210" y="250" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• If coolant is low: Top off with Soluble Cutting Oil 10:1 Mixture (Refill Cap C)</text>
  <text x="210" y="270" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• If pump P-101 is noisy/cavitating: Check Q4 circuit breaker on Main Electrical Panel</text>
  <text x="210" y="290" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">• If flow sensor FM-1 fails to register: Inspect 24V DC wiring on Terminal CN7</text>
</svg>
